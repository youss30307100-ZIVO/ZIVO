<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIVO - اكتشف العالم</title>
  <meta name="theme-color" content="#111a4d">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">
    <div class="logo">ZIVO</div>
    <div class="tagline">اكتشف العالم بطريقة جديدة</div>

    <div class="search-box">
      <input
        id="searchBox"
        type="text"
        placeholder="ابحث في ZIVO..."
        autocomplete="off"
      >
      <button id="searchButton">🔍</button>
    </div>

    <div class="quick-buttons">
      <button>🤖 ZIVO AI</button>
      <button>🖼️ Images</button>
      <button>🎬 Videos</button>
      <button>📰 News</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
